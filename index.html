<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Vídeo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        /* Capa transparente que absorbe el primer clic publicitario */
        .click-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Absorbe el primer clic de redirección -->
        <div class="click-shield" onclick="this.remove();"></div>

        <!-- iframe restringido sin permisos de popups/redirecciones -->
        <iframe 
            src="https://one.goagain.top/hembedplayer/hgdhgdh44ghdh/4/800/400" 
            allowfullscreen="true" 
            webkitallowfullscreen="true" 
            mozallowfullscreen="true"
            scrolling="no"
            sandbox="allow-scripts allow-same-origin allow-forms">
        </iframe>
    </div>

</body>
</html>
